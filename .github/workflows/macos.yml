name: macOS build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check installer syntax
        run: /bin/bash -n install.sh
      - name: Build and set up free conversion engines
        run: |
          export CITRUSDROP_ENGINES_DIR="$RUNNER_TEMP/CitrusDropEngines"
          export CITRUSDROP_MANAGED_ONLY=1
          printf 'CITRUSDROP_MANAGED_ONLY=1\n' >> "$GITHUB_ENV"
          printf 'CITRUSDROP_ENGINES_DIR=%s\n' "$CITRUSDROP_ENGINES_DIR" >> "$GITHUB_ENV"
          ./scripts/build.sh
          dist/CitrusDrop.app/Contents/MacOS/CitrusDrop --install-engines
      - name: Real conversion and safety checks
        run: ./scripts/test.sh
      - name: Verify engine signatures after conversion
        run: |
          /usr/bin/codesign --verify --strict "$CITRUSDROP_ENGINES_DIR/ffmpeg-9.0.2/ffmpeg"
          /usr/bin/codesign --verify --strict "$CITRUSDROP_ENGINES_DIR/ffmpeg-9.0.2/ffprobe"
          /usr/bin/codesign --verify --deep --strict "$CITRUSDROP_ENGINES_DIR/LibreOffice-26.8.1.app"
      - name: Build universal app and DMG
        run: ./scripts/package.sh --universal
      - name: Verify packaged app
        run: |
          /usr/bin/codesign --verify --deep --strict dist/CitrusDrop.app
          /usr/bin/lipo dist/CitrusDrop.app/Contents/MacOS/CitrusDrop -verify_arch arm64 x86_64
          dist/CitrusDrop.app/Contents/MacOS/CitrusDrop --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CitrusDrop-macOS
          path: |
            dist/CitrusDrop-macOS.zip
            dist/CitrusDrop.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: CitrusDrop-macOS
          path: release
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists; retaining its published assets.\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            release/CitrusDrop-macOS.zip \
            release/CitrusDrop.dmg \
            release/SHA256SUMS \
            --verify-tag --title "CitrusDrop $RELEASE_TAG" --generate-notes
